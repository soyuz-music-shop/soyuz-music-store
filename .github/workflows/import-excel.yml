name: Загрузить товары из Excel Ozon

on:
  push:
    paths:
      - "imports/*.xlsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать сайт
        uses: actions/checkout@v5

      - name: Подготовить Excel
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Импортировать товары
        shell: bash
        run: |
          shopt -s nullglob
          files=(imports/*.xlsx)
          if (( ${#files[@]} == 0 )); then
            echo "Excel-файлы не найдены"
            exit 0
          fi
          python scripts/import_ozon_excel.py "${files[@]}"
          rm -f "${files[@]}"

      - name: Опубликовать каталог
        run: |
          if git diff --quiet -- products.json imports; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "soyuz-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json imports
          git commit -m "Обновить каталог из Excel Ozon"
          git push
