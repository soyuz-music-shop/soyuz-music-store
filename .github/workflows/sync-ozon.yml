name: Обновить каталог из Ozon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/refresh-catalog"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать сайт
        uses: actions/checkout@v5

      - name: Получить новые товары, содержание, фото и остатки
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          SUPABASE_URL: https://sprvfwqqqktrcmalzbcq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WAITLIST_FROM_EMAIL: ${{ secrets.WAITLIST_FROM_EMAIL }}
          MAIL_SMTP_HOST: smtp.mail.ru
          MAIL_SMTP_PORT: "465"
          MAIL_SMTP_USERNAME: soyuz_music_shop@mail.ru
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: "Союз Мьюзик <soyuz_music_shop@mail.ru>"
        run: python scripts/sync_ozon.py

      - name: Опубликовать изменения
        run: |
          if git diff --quiet -- products.json avito-price-report.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "soyuz-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json avito-price-report.json
          git commit -m "Синхронизировать каталог с Ozon и Avito"
          git push
