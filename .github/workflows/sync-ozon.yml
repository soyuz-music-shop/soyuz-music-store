name: Обновить каталог из Ozon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать сайт
        uses: actions/checkout@v5

      - name: Получить новые товары, содержание, фото и остатки
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WAITLIST_FROM_EMAIL: ${{ secrets.WAITLIST_FROM_EMAIL }}
        run: python scripts/sync_ozon.py

      - name: Опубликовать изменения
        run: |
          if git diff --quiet -- products.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "soyuz-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json
          git commit -m "Синхронизировать каталог с Ozon"
          git push
